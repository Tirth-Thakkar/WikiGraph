<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiGraph</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.26.0/graphology.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/3.0.2/sigma.min.js"></script>
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="WikiGraph.Client.styles.css" rel="stylesheet" /> -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        
        function drawNewLabel(context, data, settings) {
            if (!data.label) return;

            const lines = String(data.label).split("\n");
            const fontSize = settings.labelSize;
            const fontFamily = settings.labelFont || "Arial";
            const fontWeight = settings.labelWeight || "normal";
            const lineHeight = fontSize * 1.2;

            context.save();

            context.font = `${fontWeight} ${fontSize}px "${fontFamily}"`;
            context.fillStyle = "#1f2a36";
            context.textAlign = "left";
            context.textBaseline = "middle";

            const x = data.x + data.size + 6;
            const startY = data.y - ((lines.length - 1) * lineHeight) / 2;

            lines.forEach((line, index) => {
                context.fillText(line, x, startY + index * lineHeight);
            });

            context.restore();
        }

        function drawNewHover(context, data, settings) {
            if (!data.label) return;

            const lines = String(data.label).split("\n");
            const fontSize = settings.labelSize;
            const fontFamily = settings.labelFont || "Arial";
            const fontWeight = settings.labelWeight || "normal";
            const lineHeight = fontSize * 1.2;
            const paddingX = 8;
            const paddingY = 6;
            const labelGap = 6;

            context.save();

            context.font = `${fontWeight} ${fontSize}px "${fontFamily}"`;
            const labelWidth = Math.max(...lines.map(line => context.measureText(line).width));
            const labelX = data.x + data.size + labelGap;
            const boxX = data.x - data.size - paddingX;
            const boxY = data.y - Math.max(data.size * 2, lines.length * lineHeight) / 2 - paddingY;
            const boxWidth = labelX + labelWidth + paddingX - boxX;
            const boxHeight = Math.max(data.size * 2, lines.length * lineHeight) + paddingY * 2;
            const startY = data.y - ((lines.length - 1) * lineHeight) / 2;

            context.fillStyle = "rgba(255, 250, 240, 0.96)";
            context.strokeStyle = "#d8cfba";
            context.lineWidth = 1;
            context.fillRect(boxX, boxY, boxWidth, boxHeight);
            context.strokeRect(boxX, boxY, boxWidth, boxHeight);

            context.beginPath();
            context.arc(data.x, data.y, data.size, 0, Math.PI * 2);
            context.fillStyle = data.color;
            context.fill();

            context.fillStyle = "#1f2a36";
            context.textAlign = "left";
            context.textBaseline = "middle";

            lines.forEach((line, index) => {
                context.fillText(line, labelX, startY + index * lineHeight);
            });

            context.restore();
        }

        function splitWord(label){
            const wordArray = String(label).trim().split(" ");
            const newLabel = [];
            for(let i = 0; i < wordArray.length; i+= 3){
                newLabel.push(wordArray.slice(i,i+3).join(" "))
            }
            return newLabel.join("\n");
        }



        window.graphCanvas = {
            renderer: null,

            renderGraph: function (container, graphDto) {
                //Check to see if the current Graph instance is in an HTML element(Library Intialization)
                if (!(container instanceof HTMLElement)) {
                    console.error("graphCanvas.renderGraph expected an HTMLElement container.", container);
                    return;
                }

                if (window.graphCanvas.renderer) {
                    window.graphCanvas.renderer.kill();
                    window.graphCanvas.renderer = null;
                }

                container.innerHTML = "";

                //Set up a new Graph using the graphology libary 
                //graphDto?.nodes is from the JSON serialization of the Orginal object 
                const graph = new graphology.Graph();
                const nodes = graphDto?.nodes ?? [];
                const edges = graphDto?.edges ?? [];
                const radius = Math.max(1, nodes.length / 3);
                
                //Loop through nodes
                nodes.forEach((node, index) => {
                    const id = String(node.id);
                    const angle = (2 * Math.PI * index) / Math.max(1, nodes.length);
                    //If the node is the main topic set the index
                    const isMainTopic = index === 0;
                    //see if node is a related topic or supporting detail
                    const isRelatedTopic = id.includes("detail");
                    graph.addNode(id, {
                        label: splitWord(node.label),
                        x: isMainTopic ? 0 : radius * Math.cos(angle),
                        y: isMainTopic ? 0 : radius * Math.sin(angle),
                        size: 2 + 6 * (node.weight ?? 1),
                        color: isMainTopic ? "#f6f1e3": isRelatedTopic? "#557fc0" : "#b65a5a"
                    });
                });

                edges.forEach((edge, index) => {
                    const source = String(edge.source);
                    const target = String(edge.target);
                    const relation = String(edge.relation);

                    if (!graph.hasNode(source) || !graph.hasNode(target)) {
                        return;
                    }

                    graph.addEdgeWithKey(`${source}-${target}-${index}`, source, target, {
                        label: edge.relation ?? "",
                        size: 2,
                        color: "#64748b"
                    });
                });

                window.graphCanvas.renderer = new Sigma(graph, container, {
                    cameraPanBoundaries:{
                       boundaries:{
                        x: [-9,9],
                        y: [-4,4]
                       },
                       tolerance: 25
                    },
                    minCameraRatio: 0.4,
                    maxCameraRatio: 2,

                    labelSize: 12,
                    labelFont: "Times New Roman",
                    defaultDrawNodeLabel: drawNewLabel,
                    defaultDrawNodeHover: drawNewHover
                });


            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
